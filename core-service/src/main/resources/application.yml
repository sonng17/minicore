server:
  port: 8081

spring:
  application:
    name: core-service
  datasource:
    # Oracle chạy bằng Docker theo README gốc; có thể đổi qua biến môi trường
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USER:minicore}
    password: ${DB_PASSWORD:minicore123}
  jpa:
    open-in-view: false
    hibernate:
      # Schema do script trong db/ tạo ra; JPA không tự sửa bảng
      ddl-auto: none

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
